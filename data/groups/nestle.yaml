# Nestle. Brands from Nestle's own brand list.

entities:
  - { id: entity:nestle, name: "Nestlé S.A." }
  - { id: entity:nestle-equity-holdings, name: "Nestlé Equity Holdings Limited" }
  - { id: entity:ntc-europe, name: "NTC Europe S.A." }

brands:
  - { id: brand:nescafe, name: "Nescafé" }
  - { id: brand:nespresso, name: "Nespresso" }
  - { id: brand:kitkat, name: "KitKat" }
  - { id: brand:purina, name: "Purina" }
