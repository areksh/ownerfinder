relationships:
  - id: relationship:nestle-equity-holdings-loreal
    type: holds_stake
    from: entity:nestle-equity-holdings
    to: entity:loreal
    stakePct: 20.16
    validFrom: "2025-12-31"
    scope: { include: world }
    sources: [source:loreal-urd-2025]
    note: "Stated at 31 December 2025; earlier percentages are not recorded here. L'Oréal says Nestlé's shareholding is held by this company."
  - id: relationship:ntc-europe-owns-nestle-equity-holdings
    type: owns
    from: entity:ntc-europe
    to: entity:nestle-equity-holdings
    validFrom: "2025-12-31"
    scope: { include: world }
    sources: [source:loreal-urd-2025]
    note: "L'Oréal says Nestlé Equity Holdings is owned by NTC Europe and Société des Produits Nestlé; the split is not given."
  - id: relationship:spn-owns-nestle-equity-holdings
    type: owns
    from: entity:societe-des-produits-nestle
    to: entity:nestle-equity-holdings
