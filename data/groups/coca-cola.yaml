# Coca-Cola. Brands from the company's own brand list.

entities:
  - { id: entity:coca-cola, name: "The Coca-Cola Company" }
  - { id: entity:costa, name: "Costa Limited" }
  - { id: entity:innocent, name: "Fresh Trading Ltd (innocent)" }

brands:
  - { id: brand:coca-cola, name: "Coca-Cola" }
  - { id: brand:diet-coke, name: "Diet Coke" }
  - { id: brand:fanta, name: "Fanta" }
  - { id: brand:sprite, name: "Sprite" }
  - { id: brand:powerade, name: "Powerade" }
  - { id: brand:smartwater, name: "smartwater" }
  - { id: brand:minute-maid, name: "Minute Maid" }
  - { id: brand:fairlife, name: "fairlife" }
  - { id: brand:bodyarmor, name: "BODYARMOR" }
  - { id: brand:costa-coffee, name: "Costa Coffee" }
  - { id: brand:innocent, name: "innocent" }

relationships:
  - id: relationship:coca-cola-costa
    type: owns
    from: entity:coca-cola
    to: entity:costa
    stakePct: 100
    validFrom: "2019-01-03"
    startKnown: true
    scope: { include: world }
    sources: [source:coca-cola-costa-2019]
  - id: relationship:costa-costa-coffee
    type: owns_brand
    from: entity:costa
    to: brand:costa-coffee
    validFrom: "2019-01-03"
    scope: { include: world }
    sources: [source:coca-cola-costa-2019, source:coca-cola-brands]
  - id: relationship:coca-cola-innocent-2010
    type: owns
    from: entity:coca-cola
    to: entity:innocent
    stakePct: 58
    validFrom: "2010-04"
    startKnown: true
    validTo: "2013-02"
    scope: { include: world }
    sources: [source:marketing-week-innocent-2010]
  - id: relationship:coca-cola-innocent-2013
    type: owns
    from: entity:coca-cola
    to: entity:innocent
    validFrom: "2013-02"
    startKnown: true
    scope: { include: world }
    sources: [source:marketing-week-innocent-2013]
    note: "More than 90 per cent; the report gives 90 to 99 per cent, with the founders keeping a minority."
  - id: relationship:innocent-innocent
    type: owns_brand
    from: entity:innocent
    to: brand:innocent
    validFrom: "2010-04"
    scope: { include: world }
    sources: [source:marketing-week-innocent-2010, source:coca-cola-brands]
