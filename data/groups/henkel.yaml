# Henkel. Brands from Henkel's own consumer brands page.

entities:
  - { id: entity:henkel, name: "Henkel AG & Co. KGaA" }

brands:
  - { id: brand:schwarzkopf, name: "Schwarzkopf" }
  - { id: brand:syoss, name: "Syoss" }
  - { id: brand:got2b, name: "göt2b" }
  - { id: brand:somat, name: "Somat" }
  - { id: brand:bref, name: "Bref" }
  - { id: brand:dixan, name: "Dixan" }
  - { id: brand:purex, name: "Purex" }
  - { id: brand:loctite, name: "Loctite" }

relationships:
  - id: relationship:henkel-persil
    type: owns_brand
    from: entity:henkel
    to: brand:persil
    validFrom: "1907"
    startKnown: true
    scope: { include: [DE] }
    sources: [source:henkel-history, source:henkel-persil]
    note: "Henkel launched Persil in 1907; its other markets are recorded separately."
  - id: relationship:henkel-persil-markets
    type: owns_brand
    from: entity:henkel
    to: brand:persil
    validFrom: "2026-11-08"
    scope:
      {
        include:
          [
            AT,
            AZ,
            BE,
            BG,
            HR,
            CY,
            CZ,
            EE,
            HU,
            KZ,
            MX,
            NL,
            LV,
            LT,
            PL,
            PT,
            RO,
            RS,
            SK,
            SI,
            CH,
            TW,
            TR,
            UA,
            US,
          ],
      }
    sources: [source:henkel-persil]
    note: "Henkel's Persil page links a Persil website for each of these countries; when Henkel began selling Persil in each is not recorded."
