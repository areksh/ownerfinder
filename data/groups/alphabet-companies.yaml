  - id: relationship:alphabet-owns-google
    type: owns
    from: entity:alphabet
    to: entity:google
    validFrom: "2015-10-02"
    startKnown: true
    stakePct: 100
    scope: { include: world }
    note: "On 2 October 2015 a reorganisation made Alphabet the holding company, whose only significant assets were the outstanding equity interests in Google. Before that date Google Inc. was the top company."
    sources: [source:alphabet-10k-2015]
  - id: relationship:google-owns-waze-mobile
    type: owns
    from: entity:google
    to: entity:waze-mobile
    validFrom: "2013-06"
    startKnown: true
    scope: { include: world }
    note: "Google completed its acquisition of Waze Limited in June 2013; Waze's terms now name Waze Mobile Ltd. 'including its Google affiliates and subsidiaries'. The share is not stated."
    sources: [source:google-10k-2013, source:waze-terms]
