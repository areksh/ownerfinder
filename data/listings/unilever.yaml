# Why this company is listed; wording rules: docs/listings.md.

entity: entity:unilever
evidence:
  - criterion: criterion:competition
    status: found
    date: "2011-04-13"
    summary: >-
      The European Commission fined Unilever €104 million for operating
      a cartel with Henkel and Procter & Gamble in household laundry
      powder detergents in eight EU countries between 2002 and 2005.
      Unilever acknowledged its liability and settled the case, which
      reduced the fine.
    sources: [source:ec-detergents-cartel-2011]
  - criterion: criterion:russia
    status: admitted
    date: "2024-10-08"
    summary: >-
      Unilever owned a business in Russia, with four factories, until 8
      October 2024, when it sold it to Arnest Group.
    sources: [source:unilever-20f-2025]
  - criterion: criterion:russia
    status: admitted
    date: "2022-03-08"
    summary: >-
      Unilever said in March 2022 that it would continue to supply
      everyday essential food and hygiene products made in Russia to
      people in the country, while suspending imports and exports, media
      and advertising spending and further investment there.
    sources: [source:unilever-russia-statement-2022]
